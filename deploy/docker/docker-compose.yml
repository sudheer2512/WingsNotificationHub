# Wings Notification Hub — full stack: SQL Server, RabbitMQ (management UI), Redis, API (+ admin UI) and worker.
#
#   cd deploy/docker
#   cp .env.example .env        # fill in every secret (see the comments there)
#   docker compose up -d --build
#   docker compose up -d --scale worker=3     # more dispatch capacity
#
# The API listens on http://localhost:${API_PORT:-8080}. Put a TLS-terminating reverse proxy in front of it in production
# and set PUBLIC_BASE_URL to the public https URL.

name: wings-notification-hub

x-hub-common-env: &hub-common-env
  Database__Provider: sqlserver
  ConnectionStrings__NotificationHub: "Server=sqlserver,1433;Database=${MSSQL_DATABASE:-WingsNotificationHub};User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
  Hub__MessageTransport: rabbitmq
  Messaging__RabbitMq__Uri: "amqp://${RABBITMQ_USER:-wnh}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/"
  Redis__Connection: "redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env},abortConnect=false"
  Security__EncryptionKeys__k1: "${ENCRYPTION_KEY_K1:?set ENCRYPTION_KEY_K1 in .env (openssl rand -base64 32)}"
  Security__ActiveKeyId: k1
  Hub__PublicBaseUrl: "${PUBLIC_BASE_URL:-http://localhost:8080}"
  Hub__DataDirectory: /var/lib/wings-notification-hub
  Hub__SeedDemoData: "${SEED_DEMO_DATA:-false}"
  OpenTelemetry__OtlpEndpoint: "${OTLP_ENDPOINT:-}"
  Serilog__MinimumLevel__Default: "${LOG_LEVEL:-Information}"

x-restart: &restart
  restart: unless-stopped

services:
  sqlserver:
    <<: *restart
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server images are linux/amd64 only (on Apple silicon Docker runs them under emulation).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Uncomment to reach SQL Server from the host (tools, migrations):
    # ports: ["127.0.0.1:1433:1433"]

  rabbitmq:
    <<: *restart
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-wnh}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Management UI, bound to localhost only.
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *restart
    image: "${IMAGE_REGISTRY:-wings}/notification-hub-api:${IMAGE_TAG:-latest}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      <<: *hub-common-env
      ASPNETCORE_ENVIRONMENT: Production
      Auth__SigningKey: "${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in .env (openssl rand -base64 32)}"
      # The worker service does the background processing.
      Workers__RunInApi: "false"
      Database__AutoCreate: "true"
      Bootstrap__AdminEmail: "${BOOTSTRAP_ADMIN_EMAIL:-admin@wings.local}"
      Bootstrap__AdminPassword: "${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}"
      # TLS is terminated by the reverse proxy in front of this container.
      Https__Redirect: "false"
      # Browser apps that embed the in-app inbox (comma-separated origins are not supported; add __1, __2 …).
      Cors__Origins__0: "${CORS_ORIGIN_0:-http://localhost:8080}"
      # Trust X-Forwarded-* only from your proxy's address (e.g. its address on the compose network).
      # ReverseProxy__KnownProxies__0: "172.18.0.10"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - hub-data:/var/lib/wings-notification-hub
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    <<: *restart
    image: "${IMAGE_REGISTRY:-wings}/notification-hub-worker:${IMAGE_TAG:-latest}"
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      <<: *hub-common-env
      DOTNET_ENVIRONMENT: Production
      # The API creates/updates the schema; the worker only starts once the API is healthy.
      Database__AutoCreate: "false"
    volumes:
      # Shared with the API: uploaded attachments are read by the worker when it sends e-mail.
      - hub-data:/var/lib/wings-notification-hub
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 40s
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  mssql-data:
  rabbitmq-data:
  redis-data:
  hub-data:
